name: Generate code coverage reports

on:
  - push
  - pull_request
  - workflow_dispatch
  
jobs:
  code-coverage:

    runs-on: ubuntu-latest

    env:
      PIO_ENV: native_code_coverage
      FILE_ROOT: speeduino_coverage
      GCOV_IGNORES: |
          test/
          lib/ArduinoFake/
          .pio/libdeps/
          speeduino/src/SPIAsEEPROM/
          (.+/)?unity_config\.c$
          (.+/)?board_native\.(?:h|cpp)$

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
          cache: 'pip' # Enables caching for dependencies

    - name: Create Python venv
      run: |
        sudo apt-get install python3-venv
        python3 -m venv PIO

    - name: Install PlatformIO
      run: |
        source PIO/bin/activate
        pip install platformio
       
    - name: Test native timer lifetime
      run: |
        g++ -std=c++14 -O1 -g -DNATIVE_BOARD -pthread -I lib/ArduinoFake \
          .github/workflows/tests/test_software_timer.cpp lib/ArduinoFake/SoftwareTimer.cpp \
          -o /tmp/test-software-timer
        timeout 30s /tmp/test-software-timer

    - name: Run Code Coverage Tests (8x8)
      id: tests_8x8
      # We want the coverage to reflect the status of the
      # unit tests: so even if the tests fail or outright
      # crash, continue the rest of the workflow.
      continue-on-error: true
      run: | 
        source PIO/bin/activate
        export PLATFORMIO_BUILD_FLAGS="-D INJ_CHANNELS=8 -D IGN_CHANNELS=8"
        platformio test -e ${{ env.PIO_ENV }} ${{ vars.PIO_CMD_PARAMS }}
        
    - name: Run Code Coverage Tests (Other)
      id: tests_other
      continue-on-error: true
      # Set NO_MULTI_CHANNEL=1 to skip this step and only run the 8x8 coverage tests.
      if: ${{ !vars.NO_MULTI_CHANNEL }}
      run: |       
        source PIO/bin/activate
        mv .pio/build .pio/build88
        export PLATFORMIO_BUILD_FLAGS="-D INJ_CHANNELS=4 -D IGN_CHANNELS=4"
        platformio test -e ${{ env.PIO_ENV }} ${{ vars.PIO_CMD_PARAMS }}

    - name: Upload to CodeCov
      uses: codecov/codecov-action@v5
      if: ${{ !env.ACT }}
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        gcov_ignore: ${{ env.GCOV_IGNORES }}
        # verbose: true 

    - name: Install gcovr
      if: ${{ env.ACT }}
      run: |
        source PIO/bin/activate
        pip install gcovr

    - name: Generate coverage report
      if: ${{ env.ACT }}
      run: |
        mkdir -p .pio/build/${{ env.PIO_ENV }}
        EXCLUDES=$(echo "${{ env.GCOV_IGNORES }}" | sed '/^[[:space:]]*$/d' | sed 's/^/--exclude /' | tr '\n' ' ')
        OUTPUT_ROOT=.pio/build/${{ env.PIO_ENV }}/${{ env.FILE_ROOT }}
        source PIO/bin/activate
        gcovr \
          $EXCLUDES \
          --cobertura $OUTPUT_ROOT.cobertura \
          --html-details $OUTPUT_ROOT.html \
          --json $OUTPUT_ROOT.json \
          --json-pretty \
          --lcov $OUTPUT_ROOT.lcov \
          --sonarqube $OUTPUT_ROOT.sonarqube \
          --xml $OUTPUT_ROOT.xml \
          --coveralls $OUTPUT_ROOT.coveralls \
          --exclude-unreachable-branches \
          --exclude-throw-branches

    - name: Upload reports
      if: ${{ env.ACT }}
      uses: actions/upload-artifact@v4
      with:
        path: |
          .pio/build/${{ env.PIO_ENV }}/${{ env.FILE_ROOT }}.*

    - name: Check native test results
      if: ${{ always() && (steps.tests_8x8.outcome == 'failure' || steps.tests_other.outcome == 'failure') }}
      run: |
        echo "::error::Native tests failed. See the test steps above; coverage reporting was allowed to complete."
        exit 1
